name: Keep Supabase awake

# Free Supabase projects pause after a week with no requests. This pings the
# database every other day so syncing keeps working while you're on holiday.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Add SUPABASE_URL and SUPABASE_KEY repository secrets to keep Supabase awake."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "${URL%/}/rest/v1/mm_items?select=key&limit=1" -H "apikey: $KEY")
          echo "Supabase answered HTTP $code"
          [ "$code" = "200" ]
